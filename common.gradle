final int mcVersion = project.mcVersion

apply plugin: 'maven-publish'
apply plugin: 'fabric-loom'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'net.kyori.blossom'

// 1.20.1 强制 Java 17
JavaVersion JAVA_COMPATIBILITY = JavaVersion.VERSION_17

repositories {
    mavenLocal()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.hendrixshen.top/' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

    modImplementation("top.hendrixshen.magiclib:magiclib-${project.minecraft_version.replace(".", "_")}:${project.magiclib_version}") {
        exclude group: "carpet", module: "fabric-carpet"
    }

    [
        ["curse.maven:minihud-244260", "minihud"],
        ["curse.maven:litematica-308892", "litematica"],
        ["maven.modrinth:client-commands", "clientcommands"]
    ].each { entry ->
        if (project.hasProperty("${entry[1]}_version")) {
            modApi("${entry[0]}:${project.property("${entry[1]}_version")}") {
                transitive(entry[1] == "clientcommands")
            }
        }
    }
}

java {
    sourceCompatibility = JAVA_COMPATIBILITY
    targetCompatibility = JAVA_COMPATIBILITY
    withSourcesJar()
}

base {
    archivesName = "${project.mod_archives_base_name}-mc${project.minecraft_version}"
}

processResources {
    def props = [
        "mod_id": project.mod_id,
        "mod_name": project.mod_name,
        "mod_version": project.version,
        "minecraft_dependency": project.minecraft_dependency
    ]
    inputs.properties(props)
    filesMatching("fabric.mod.json") { expand props }
}

blossom {
    replaceToken("@MOD_IDENTIFIER@", project.mod_id)
    replaceToken("@MOD_NAME@", project.mod_name)
}
