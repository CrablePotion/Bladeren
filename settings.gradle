pluginManagement {
    repositories {
        mavenLocal()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.hendrixshen.top/" }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.replaymod.preprocess") {
                useModule("com.github.Fallen-Breath:preprocess:${requested.version}")
            }
        }
    }
}

rootProject.name = "Bladeren"

def versions = ["1.20.1"]
for (String version : versions) {
    include(":$version")
    project(":$version").projectDir = file("versions/$version")
    project(":$version").buildFileName = "../../common.gradle"
}
include(":fabricWrapper")
