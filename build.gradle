plugins {
    id 'maven-publish'
    // 这里的 ID 会被 settings.gradle 里的 resolutionStrategy 拦截并重定向到 JitPack
    id 'com.replaymod.preprocess' version 'c5abb4fb12'
    id 'net.fabricmc.fabric-loom' version '1.3-SNAPSHOT' apply false
    id 'io.github.juuxel.loom-vineflower' version '1.11.0' apply false
    id 'net.kyori.blossom' version '1.3.1' apply false
    id 'org.ajoberstar.grgit' version '5.2.0'
}

preprocess {
    // 对齐模板的节点定义方式
    def mc1201 = createNode('1.20.1', 1_20_01, '')

    // 关键启示：主动遍历节点并注入 mcVersion 变量
    for (final def node in getNodes()) {
        def p = findProject(node.project)
        if (p != null) {
            p.ext.mcVersion = node.mcVersion
        }
    }
}

ext {
    getBuildNumber = { System.getenv("GITHUB_RUN_NUMBER") ?: "dev" }
}

version = "${project.mod_version}+build.${getBuildNumber()}"

tasks.register("cleanPreprocessSources") {
    doFirst { subprojects { delete(file("build/preprocessed")) } }
}
